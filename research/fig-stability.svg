<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">CBA ranking stability under game-level bootstrap resampling</title>
  <desc id="desc">Mean Spearman correlations are 0.786 for offense and 0.762 for defense. Mean top-50 overlaps are 0.612 for offense and 0.603 for defense.</desc>
  <rect width="800" height="360" fill="#fffdf9"/>
  <text x="40" y="40" fill="#183637" font-family="Georgia, serif" font-size="24" font-weight="700">Game-bootstrap ranking stability</text>
  <text x="40" y="66" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="14">200 resamples; 287 players meeting the 200-possession reporting floor</text>

  <line x1="180" y1="92" x2="180" y2="286" stroke="#c9d4cf"/>
  <line x1="180" y1="286" x2="690" y2="286" stroke="#c9d4cf"/>
  <line x1="430" y1="92" x2="430" y2="286" stroke="#e6ebe8" stroke-dasharray="4 5"/>
  <line x1="680" y1="92" x2="680" y2="286" stroke="#e6ebe8" stroke-dasharray="4 5"/>

  <text x="176" y="310" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">0</text>
  <text x="430" y="310" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">0.5</text>
  <text x="680" y="310" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">1.0</text>

  <text x="166" y="119" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Offense Spearman</text>
  <rect x="180" y="101" width="393" height="24" rx="3" fill="#0b5457"/>
  <text x="584" y="119" fill="#183637" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">0.786</text>

  <text x="166" y="169" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Defense Spearman</text>
  <rect x="180" y="151" width="381" height="24" rx="3" fill="#2b7a78"/>
  <text x="572" y="169" fill="#183637" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">0.762</text>

  <text x="166" y="229" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Offense top-50 overlap</text>
  <rect x="180" y="211" width="306" height="24" rx="3" fill="#b5683f"/>
  <text x="497" y="229" fill="#183637" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">0.612</text>

  <text x="166" y="269" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Defense top-50 overlap</text>
  <rect x="180" y="251" width="302" height="24" rx="3" fill="#d18a62"/>
  <text x="493" y="269" fill="#183637" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">0.603</text>

  <text x="40" y="342" fill="#6e7d79" font-family="Segoe UI, sans-serif" font-size="11">Source: CBA Influence Model, ranking-stability diagnostics, 2025-26 snapshot.</text>
</svg>
