<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Calibration factors for nominal 95 percent player-effect intervals</title>
  <desc id="desc">At simulation signal standard deviations 1, 3, and 6, first-ridge calibration factors are 1.171, 1.899, and 2.999. Hierarchical empirical-Bayes factors are 0.579, 0.923, and 1.094.</desc>
  <rect width="800" height="400" fill="#fffdf9"/>
  <text x="40" y="40" fill="#183637" font-family="Georgia, serif" font-size="24" font-weight="700">95% interval calibration</text>
  <text x="40" y="66" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="14">Factor above 1 widens the original interval; factor below 1 narrows it</text>

  <line x1="90" y1="100" x2="90" y2="320" stroke="#c9d4cf"/>
  <line x1="90" y1="320" x2="730" y2="320" stroke="#c9d4cf"/>
  <line x1="90" y1="250" x2="730" y2="250" stroke="#9daba6" stroke-dasharray="5 5"/>
  <text x="80" y="254" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="end">1.0</text>
  <text x="80" y="325" fill="#5d6e6d" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="end">0</text>

  <rect x="160" y="218" width="48" height="102" rx="3" fill="#0b5457"/>
  <rect x="214" y="279" width="48" height="41" rx="3" fill="#d18a62"/>
  <text x="186" y="210" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.17</text>
  <text x="238" y="271" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.58</text>
  <text x="211" y="348" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">SD 1</text>

  <rect x="360" y="154" width="48" height="166" rx="3" fill="#0b5457"/>
  <rect x="414" y="255" width="48" height="65" rx="3" fill="#d18a62"/>
  <text x="386" y="146" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.90</text>
  <text x="438" y="247" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.92</text>
  <text x="411" y="348" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">SD 3</text>

  <rect x="560" y="110" width="48" height="210" rx="3" fill="#0b5457"/>
  <rect x="614" y="243" width="48" height="77" rx="3" fill="#d18a62"/>
  <text x="586" y="102" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3.00</text>
  <text x="638" y="235" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.09</text>
  <text x="611" y="348" fill="#183637" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">SD 6</text>

  <rect x="160" y="85" width="12" height="12" rx="2" fill="#0b5457"/>
  <text x="180" y="96" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12">First ridge</text>
  <rect x="270" y="85" width="12" height="12" rx="2" fill="#d18a62"/>
  <text x="290" y="96" fill="#183637" font-family="Segoe UI, sans-serif" font-size="12">Hierarchical EB</text>

  <text x="40" y="382" fill="#6e7d79" font-family="Segoe UI, sans-serif" font-size="11">Source: CBA Influence Model, simulation-based uncertainty calibration, offense effects.</text>
</svg>
